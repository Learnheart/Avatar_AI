<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Mirror AI Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Connection status indicator */
    #status {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
    }

    #status.connected {
      background: rgba(0, 200, 100, 0.15);
      color: #00c864;
      border: 1px solid rgba(0, 200, 100, 0.3);
    }

    #status.disconnected {
      background: rgba(255, 60, 60, 0.15);
      color: #ff4444;
      border: 1px solid rgba(255, 60, 60, 0.3);
    }

    #status.reconnecting {
      background: rgba(255, 180, 0, 0.15);
      color: #ffb400;
      border: 1px solid rgba(255, 180, 0, 0.3);
    }

    /* Loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: rgba(255,255,255,0.7);
      font-family: sans-serif;
      z-index: 200;
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-bar-outer {
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #6c63ff, #48a999);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }

    #loading-text {
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <!-- Loading overlay -->
  <div id="loading">
    <div style="font-size:18px; font-weight:600; letter-spacing:1px;">MAGIC MIRROR</div>
    <div id="loading-bar-outer"><div id="loading-bar"></div></div>
    <div id="loading-text">Đang khởi động...</div>
  </div>

  <!-- WebGL canvas -->
  <div id="canvas-container"></div>

  <!-- Connection status -->
  <div id="status" class="disconnected">● OFFLINE</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
