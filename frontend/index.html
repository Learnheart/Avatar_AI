<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Mirror AI Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Connection status indicator */
    #status {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
    }

    #status.connected,
    #status.idle,
    #status.listening,
    #status.speaking {
      background: rgba(0, 200, 100, 0.15);
      color: #00c864;
      border: 1px solid rgba(0, 200, 100, 0.3);
    }

    #status.disconnected {
      background: rgba(255, 60, 60, 0.15);
      color: #ff4444;
      border: 1px solid rgba(255, 60, 60, 0.3);
    }

    #status.reconnecting,
    #status.thinking {
      background: rgba(255, 180, 0, 0.15);
      color: #ffb400;
      border: 1px solid rgba(255, 180, 0, 0.3);
    }

    /* Knowledge panel */
    #knowledge-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      z-index: 100;
    }

    #knowledge-toggle:hover { background: rgba(255,255,255,0.16); }

    #knowledge-panel {
      position: fixed;
      top: 56px;
      left: 16px;
      width: 340px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-radius: 12px;
      font-family: sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      background: rgba(18, 18, 28, 0.94);
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 100;
    }

    #knowledge-panel[hidden] { display: none; }

    #knowledge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
    }

    #knowledge-close,
    .knowledge-remove {
      color: rgba(255,255,255,0.7);
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .knowledge-remove:hover { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.6); }

    #knowledge-drop {
      padding: 18px 12px;
      text-align: center;
      line-height: 1.6;
      border: 1px dashed rgba(255,255,255,0.3);
      border-radius: 8px;
      cursor: pointer;
    }

    #knowledge-drop:hover,
    #knowledge-drop.dragging {
      border-color: #6c63ff;
      background: rgba(108, 99, 255, 0.12);
    }

    #knowledge-hint,
    #knowledge-empty,
    .knowledge-doc-detail { font-size: 12px; opacity: 0.6; }

    #knowledge-message { min-height: 16px; white-space: pre-line; color: #00c864; }
    #knowledge-message.error { color: #ff6b6b; }

    #knowledge-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #knowledge-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .knowledge-doc { min-width: 0; }

    .knowledge-doc-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: rgba(255,255,255,0.7);
      font-family: sans-serif;
      z-index: 200;
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-bar-outer {
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #6c63ff, #48a999);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }

    #loading-text {
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <!-- Loading overlay -->
  <div id="loading">
    <div style="font-size:18px; font-weight:600; letter-spacing:1px;">MAGIC MIRROR</div>
    <div id="loading-bar-outer"><div id="loading-bar"></div></div>
    <div id="loading-text">Đang khởi động...</div>
  </div>

  <!-- WebGL canvas -->
  <div id="canvas-container"></div>

  <!-- Connection status -->
  <div id="status" class="disconnected">● OFFLINE</div>

  <!-- Knowledge base: the documents the avatar answers from -->
  <button id="knowledge-toggle" type="button">Tài liệu</button>
  <div id="knowledge-panel" hidden>
    <div id="knowledge-header">
      <span>Tài liệu tri thức</span>
      <button id="knowledge-close" type="button">Đóng</button>
    </div>
    <div id="knowledge-drop">
      Chọn hoặc kéo thả tệp vào đây
      <div id="knowledge-hint"></div>
    </div>
    <input id="knowledge-input" type="file" multiple hidden />
    <div id="knowledge-message"></div>
    <div id="knowledge-empty">Chưa có tài liệu nào.</div>
    <ul id="knowledge-list"></ul>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
